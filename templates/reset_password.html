{% extends "base.html" %}

{% block title %}Reset password – DyslexiLens{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-panel">
    <div class="auth-header">
      <h1>Choose a new password</h1>
    </div>

    <form method="POST" action="{{ url_for('reset_password', token=token) }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label for="password" class="form-label">New password</label>
        <div class="pw-field">
          <input type="password" id="password" name="password" class="form-input" required autocomplete="new-password" autofocus>
          {{ eye_toggle('#password') }}
        </div>
        <span class="form-hint">At least 8 characters, with a letter and a number.</span>
      </div>
      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm new password</label>
        <div class="pw-field">
          <input type="password" id="confirm_password" name="confirm_password" class="form-input" required autocomplete="new-password">
          {{ eye_toggle('#confirm_password') }}
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-full">Change password</button>
    </form>

    <div class="auth-footer">
      <a href="{{ url_for('login') }}">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
