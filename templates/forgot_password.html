{% extends "base.html" %}

{% block title %}Forgot password – DyslexiLens{% endblock %}

{% block content %}
<div class="auth-container">
  <div class="auth-panel">
    <div class="auth-header">
      <h1>Forgot password</h1>
    </div>

    {% if mail_enabled %}
      <p>Enter your email and we'll send you a reset link.</p>
      <form method="POST" action="{{ url_for('forgot_password') }}" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-input" required autocomplete="email" autofocus>
        </div>
        <button type="submit" class="btn btn-primary btn-full">Send reset link</button>
      </form>
    {% else %}
      <p>Contact the admin to reset your password.</p>
    {% endif %}

    <div class="auth-footer">
      <a href="{{ url_for('login') }}">Back to log in</a>
    </div>
  </div>
</div>
{% endblock %}
